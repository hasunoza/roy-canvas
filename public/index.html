<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ロイに聞く</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #222;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    #canvas-wrapper {
      position: relative;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      touch-action: none;
    }

    canvas {
      display: block;
      border-radius: 16px;
      cursor: crosshair;
      touch-action: none;
    }

    #toolbar {
      display: flex;
      gap: 10px;
      margin: 14px 0;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 8px 18px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.96); }

    #btn-pen    { background: #222; color: #fff; }
    #btn-eraser { background: #e0e0e0; color: #333; }
    #btn-clear  { background: #fde8e8; color: #c0392b; }
    #btn-copy   { background: #e8f4fd; color: #2980b9; }
    #btn-send   { background: #4f46e5; color: #fff; font-size: 1rem; padding: 10px 28px; }

    button.active { outline: 3px solid #4f46e5; outline-offset: 2px; }

    #comment-input {
      width: min(600px, 90vw);
      padding: 10px 14px;
      border: 1.5px solid #d0d0d0;
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
      resize: none;
      height: 60px;
      margin-bottom: 8px;
    }

    #comment-input:focus { outline: none; border-color: #4f46e5; }

    #response-area {
      width: min(600px, 90vw);
      margin-top: 20px;
      background: #fff;
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      font-size: 0.95rem;
      line-height: 1.7;
      color: #333;
      white-space: pre-wrap;
      min-height: 60px;
      display: none;
    }

    #response-area.visible { display: block; }

    #response-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #4f46e5;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #loading {
      display: none;
      color: #888;
      font-size: 0.9rem;
      margin-top: 12px;
    }

    #loading.visible { display: block; }

    .dot-anim::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
    }
  </style>
</head>
<body>
  <h1>ロイに聞く ✏️</h1>

  <div id="canvas-wrapper">
    <canvas id="canvas" width="600" height="400"></canvas>
  </div>

  <div id="toolbar">
    <button id="btn-pen" class="active">ペン</button>
    <button id="btn-eraser">消しゴム</button>
    <button id="btn-clear">全消し</button>
    <button id="btn-copy">コピー 📋</button>
  </div>

  <textarea id="comment-input" placeholder="コメントを追加（任意）"></textarea>

  <button id="btn-send">ロイに送る →</button>

  <div id="loading"><span class="dot-anim">ロイが考えています</span></div>

  <div id="response-area">
    <div id="response-label">ロイより</div>
    <div id="response-text"></div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const dpr = window.devicePixelRatio || 1;
    const W = 600, H = 400;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.scale(dpr, dpr);

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let drawing = false;
    let mode = 'pen';
    let points = [];

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY,
        pressure: e.pressure || 0.5
      };
    }

    function startDraw(e) {
      e.preventDefault();
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      const p = getPos(e);
      points = [p];
    }

    function draw(e) {
      e.preventDefault();
      if (!drawing) return;
      const p = getPos(e);
      points.push(p);

      if (points.length < 3) return;

      const len = points.length;
      const p0 = points[len - 3];
      const p1 = points[len - 2];
      const p2 = points[len - 1];

      // ベジェ曲線でなめらかに
      const cpX = (p0.x + p2.x) / 2;
      const cpY = (p0.y + p2.y) / 2;

      ctx.beginPath();
      ctx.moveTo((p0.x + p1.x) / 2, (p0.y + p1.y) / 2);
      ctx.quadraticCurveTo(p1.x, p1.y, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);

      if (mode === 'eraser') {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 20;
      } else {
        ctx.strokeStyle = '#222';
        // 筆圧で太さを変える（0.5〜4px）
        const pressure = p1.pressure > 0 ? p1.pressure : 0.5;
        ctx.lineWidth = Math.max(0.5, Math.min(4, pressure * 4));
      }
      ctx.stroke();
    }

    function stopDraw(e) {
      if (!drawing) return;
      drawing = false;

      // 最後の点を描き切る
      if (points.length >= 2) {
        const p1 = points[points.length - 2];
        const p2 = points[points.length - 1];
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        if (mode !== 'eraser') {
          ctx.strokeStyle = '#222';
          ctx.lineWidth = Math.max(0.5, Math.min(4, p2.pressure * 4));
        }
        ctx.stroke();
      }
      points = [];
    }

    canvas.addEventListener('pointerdown', startDraw);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDraw);
    canvas.addEventListener('pointercancel', stopDraw);
    canvas.addEventListener('pointerleave', stopDraw);

    document.getElementById('btn-pen').addEventListener('click', () => {
      mode = 'pen';
      document.getElementById('btn-pen').classList.add('active');
      document.getElementById('btn-eraser').classList.remove('active');
    });

    document.getElementById('btn-eraser').addEventListener('click', () => {
      mode = 'eraser';
      document.getElementById('btn-eraser').classList.add('active');
      document.getElementById('btn-pen').classList.remove('active');
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
    });

    document.getElementById('btn-copy').addEventListener('click', async () => {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = W;
      tempCanvas.height = H;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.fillStyle = '#fff';
      tCtx.fillRect(0, 0, W, H);
      tCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, W, H);
      try {
        await navigator.clipboard.write([
          new ClipboardItem({
            'image/png': new Promise(resolve => tempCanvas.toBlob(resolve))
          })
        ]);
        const btn = document.getElementById('btn-copy');
        btn.textContent = 'コピー済 ✅';
        setTimeout(() => btn.textContent = 'コピー 📋', 2000);
      } catch (err) {
        alert('コピーできませんでした: ' + err.message);
      }
    });

    document.getElementById('btn-send').addEventListener('click', async () => {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = W;
      tempCanvas.height = H;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.fillStyle = '#fff';
      tCtx.fillRect(0, 0, W, H);
      tCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, W, H);
      const dataURL = tempCanvas.toDataURL('image/png');
      const base64 = dataURL.replace(/^data:image\/png;base64,/, '');

      const comment = document.getElementById('comment-input').value.trim();

      document.getElementById('loading').classList.add('visible');
      document.getElementById('response-area').classList.remove('visible');
      document.getElementById('btn-send').disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imageBase64: base64, comment }),
        });
        const data = await res.json();
        document.getElementById('response-text').textContent = data.reply || data.error || 'エラーが発生しました';
        document.getElementById('response-area').classList.add('visible');
      } catch (err) {
        document.getElementById('response-text').textContent = 'ネットワークエラー: ' + err.message;
        document.getElementById('response-area').classList.add('visible');
      } finally {
        document.getElementById('loading').classList.remove('visible');
        document.getElementById('btn-send').disabled = false;
      }
    });
  </script>
</body>
</html>
